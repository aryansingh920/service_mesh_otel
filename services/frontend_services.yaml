apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mesh-apps
spec:
  ports: [{port: 80, targetPort: 5678}]
  selector: {app: frontend}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mesh-apps
spec:
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      nodeSelector: {workload: frontend} # Using the node labels from your Kind config
      containers:
      - name: app
        image: hashicorp/http-echo
        args: ["-text", "I am the Frontend"]
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
